[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "taskfoundry"
version = "0.1.0"
description = "Compile Python data-pipeline repair tasks into reproducible, independently graded agent environments"
requires-python = ">=3.11"
authors = [{name = "Tabish Syed"}]
readme = "README.md"
dependencies = []
[project.optional-dependencies]
dev = ["pytest==9.2.0"]
harbor = ["harbor==0.26.0"]
[project.scripts]
taskfoundry = "taskfoundry.cli:main"
[tool.setuptools.packages.find]
include = ["taskfoundry*"]
[tool.setuptools.package-data]
taskfoundry = ["*.html"]
